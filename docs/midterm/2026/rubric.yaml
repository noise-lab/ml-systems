  text: (a) Name the five header fields that define a flow. In Hands-On 5 it was safe to group packets
    by only four of them; which one could be left out, and why? (b) Two packets match on all five fields
    but arrive 45 seconds apart with no packets in between. Would a router using conventional settings
    put them in the same flow record? Why or why not?
  parts:
  - kind: free
    prompt: (a) Name the five header fields that define a flow. In Hands-On 5 it was safe to group packets
      by only four of them; which one could be left out, and why? (b) Two packets match on all five fields
      but arrive 45 seconds apart with no packets in between. Would a router using conventional settings
      put them in the same flow record? Why or why not?
    solution: (a) Source IP, destination IP, source port, destination port, protocol. Protocol could be
      omitted because the whole trace was UDP DNS traffic on port 53. (b) No. Routers end a flow after
      a period of inactivity (typically about 15 to 30 seconds), so the second packet starts a new flow
      record.
    height_in: 1.3
