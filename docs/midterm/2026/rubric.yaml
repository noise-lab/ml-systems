- number: 10
  points: 3.0
  section: Features and Representation
  text: Some rows in your flow dataset have missing values. Give one example from network data where filling
    in the column average is reasonable, and one where it is a bad idea. Explain why for the second.
  parts:
  - kind: free
    prompt: Some rows in your flow dataset have missing values. Give one example from network data where
      filling in the column average is reasonable, and one where it is a bad idea. Explain why for the
      second.
    solution: 'Reasonable: a missing measurement in an otherwise steady series where the gap is a recording
      glitch; a numeric field that clusters tightly, such as packet sizes near the MTU; latency or throughput
      during a stable period. Bad idea, with why: when the missing or strange value may itself be the
      anomaly you want to detect (a corrupted sequence number, a malformed packet, an absent field during
      an attack), averaging erases exactly that signal; a categorical or discrete field (protocol, port,
      TCP flags, a resolution label), where the average is a value that does not exist; an ordered series
      such as timestamps or inter-arrival times, where the column mean ignores order (fill from neighbors
      instead) and hides bursts; computing the average over the whole dataset before the split (leakage).
      A reason is required only for the bad example.'
    height_in: 1.3
    id: '10'
    points: 3.0
    criteria:
    - id: key
      points: 3.0
      description: 'Reasonable: a missing measurement in an otherwise steady series where the gap is a
        recording glitch; a numeric field that clusters tightly, such as packet sizes near the MTU; latency
        or throughput during a stable period. Bad idea, with why: when the missing or strange value may
        itself be the anomaly you want to detect (a corrupted sequence number, a malformed packet, an
        absent field during an attack), averaging erases exactly that signal; a categorical or discrete
        field (protocol, port, TCP flags, a resolution label), where the average is a value that does
        not exist; an ordered series such as timestamps or inter-arrival times, where the column mean
        ignores order (fill from neighbors instead) and hides bursts; computing the average over the whole
        dataset before the split (leakage). A reason is required only for the bad example.'
    note: 'The original key was flawed: its reasonable example (a timestamp bounded by its neighbors)
      is filling from neighbors, not the column mean; it missed categorical and ordered fields as bad
      examples; and it expected a reason for the first example, which the question did not ask for. Every
      non-blank answer receives full credit (3) this term (Nov 4).'
- number: 11
  points: 3.0
  section: Training and Evaluation
  text: You have six months of hourly traffic volumes and want to forecast next month's load to decide
    whether to add a server. You shuffle all rows randomly, split 80/20, and get low test error. Is that
    a trustworthy estimate of how well the model will forecast? Why or why not?
  parts:
  - kind: yes_no
    prompt: You have six months of hourly traffic volumes and want to forecast next month's load to decide
      whether to add a server. You shuffle all rows randomly, split 80/20, and get low test error. Is
      that a trustworthy estimate of how well the model will forecast?
    answer: 'no'
    id: 11a
    points: 1.0
  - kind: free
    prompt: Why or why not?
    solution: 'No. A random split puts later hours in the training set and earlier hours in the test set,
      so the model predicts the past from the future (temporal leakage); hourly rows are not independent.
      One correct reason earns full credit. (Not required, since the question did not ask: train on the
      earlier months and test on the later ones, which also mimics the real forecasting task.)'
    height_in: 1.2
    id: 11b
    note: The original key required a fix (train on earlier months, test on later), which the question
      never asked for. Full credit (2) for No plus a correct reason why, e.g. a random split trains on
      later hours and tests on earlier ones (temporal leakage, the model sees the future), or hourly rows
      are not independent. Never deduct for not proposing a fix or for not writing No in prose when the
      yes/no part is marked No.
    points: 2.0
    explains: 11a
    criteria:
    - id: key
      points: 2.0
