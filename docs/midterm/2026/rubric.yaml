  section: 'Assignment 1: Video Quality Inference'
  text: A student's Assignment 1 classifier scores 75% accuracy with a random train/test split, but about
    30% when every session from one household is held out for testing. (a) What does this suggest the
    model learned? (b) An ISP wants to deploy the model in new homes. Which accuracy is the better estimate,
    and name one change that would help.
  parts:
  - kind: free
    prompt: A student's Assignment 1 classifier scores 75% accuracy with a random train/test split, but
      about 30% when every session from one household is held out for testing. (a) What does this suggest
      the model learned? (b) An ISP wants to deploy the model in new homes. Which accuracy is the better
      estimate, and name one change that would help.
    solution: (a) Some features fingerprint the household (its devices, access link, network conditions)
      rather than video quality; with a random split the same households appear in training and test,
      so the model can recognize the home instead of the resolution (a spurious correlation, non-representative
      training data). (b) The held-out-household number. Remove household-specific proxy features, split
      by household, train on more diverse households ("more data" counts when it means more households),
      or balance the classes.
    height_in: 2.5
    id: '15'
    note: '"Which accuracy is the better estimate" in (b) is a bad question; many students asked about
      its wording. Never deduct for which accuracy the student picked or for leaving it out. Award criterion
      b (2 points) only on naming one reasonable change (remove household-specific proxy features, split
      by household, train on more diverse households, balance the classes, or similar). Grade (a) as written.
      See grading-notes.md.'
    points: 4.0
    criteria:
    - id: a
      points: 2.0
      description: Some features fingerprint the household (its devices, access link, network conditions)
        rather than video quality; with a random split the same households appear in training and test,
        so the model can recognize the home instead of the resolution (a spurious correlation, non-representative
        training data).
    - id: b
      points: 2.0
      description: The held-out-household number. Remove household-specific proxy features, split by household,
        train on more diverse households, or balance the classes.
