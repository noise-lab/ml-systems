- number: 14
  points: 3.0
  section: 'Assignment 1: Video Quality Inference'
  text: In Hands-On 3 and Assignment 1 you computed a segment-download-rate feature from encrypted Netflix
    traffic. (a) How can you find segment boundaries without decrypting anything? (b) Why do segments
    carry information about resolution?
  parts:
  - kind: free
    prompt: In Hands-On 3 and Assignment 1 you computed a segment-download-rate feature from encrypted
      Netflix traffic. (a) How can you find segment boundaries without decrypting anything? (b) Why do
      segments carry information about resolution?
    solution: '(a) The player downloads segments in bursts; boundaries show up as gaps in the download
      marked by small or zero-byte packets between bursts. (b) Adaptive streaming encodes the video at
      several bitrates; the player requests each segment at a chosen bitrate, so higher resolution means
      more bytes per segment, which shows up in segment sizes and download rate. Also correct: segments
      have roughly constant duration, so the bytes per segment reveal the bitrate, and with it the resolution.'
    height_in: 2.0
    id: '14'
    points: 3.0
    criteria:
    - id: a
      points: 1.5
      description: The player downloads segments in bursts; boundaries show up as gaps in the download
        marked by small or zero-byte packets between bursts.
    - id: b
      points: 1.5
      description: Adaptive streaming encodes the video at several bitrates; the player requests each
        segment at a chosen bitrate, so higher resolution means more bytes per segment, which shows up
        in segment sizes and download rate.
    note: 'Part (a): either half of the model answer identifies the boundary and earns full credit on its own: bursts separated by gaps, or the small or zero-byte (request) packets between segments. Part (b): a terse but correct chain, such as bytes over time gives bitrate gives resolution, earns full credit (decided 2026-11-05).'

- number: 15
