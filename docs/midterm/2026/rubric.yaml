- number: 8
  points: 4.0
  section: Features and Representation
  text: In Hands-On 6 you used netml to turn a capture into per-flow STATS features. nPrint instead turns
    each packet into a fixed-width bitmap of its header bits and lets a model learn which bits matter.
    Give one advantage and one disadvantage of each approach.
  parts:
  - kind: free
    prompt: In Hands-On 6 you used netml to turn a capture into per-flow STATS features. nPrint instead
      turns each packet into a fixed-width bitmap of its header bits and lets a model learn which bits
      matter. Give one advantage and one disadvantage of each approach.
    solution: 'Manual features (netml): advantages are compact input, interpretability, encoding domain
      knowledge, and the ability to express rates and timing; disadvantages are that it needs domain expertise,
      many encoding choices hurt reproducibility, and features built for one task may not transfer. Representation
      learning (nPrint): advantages are no hand-crafted features, one representation reused across tasks,
      the model finds informative header bits; disadvantages are large storage (about twice), no notion
      of time or rates, needs more data, and risk of spurious correlations (TTL, addresses) that domain
      knowledge must catch.'
    height_in: 1.6
    id: '8'
    note: 'One point for each of the four items: an advantage of netml features, a disadvantage of netml
      features, an advantage of nPrint, a disadvantage of nPrint. Credit any correct, reasonable point,
      not only those in the model answer (for example: netml is cheap to compute or works with less data;
      nPrint can be less interpretable or needs more compute). Credit an item when it is stated loosely
      or only implied by a contrast with the other approach. Benefit of the doubt. See grading-notes.md.'
    points: 4.0
    criteria:
    - id: key
