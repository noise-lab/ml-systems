- number: 12
  points: 5.0
  section: Training and Evaluation
  text: 'A detector labels 1,000 flows; 20 of them are attacks (attack is the positive class). Its confusion
    matrix: 1c & 1cPredicted attack & 1cPredicted benign 2-3 True attack & 15 & 5 2-3 True benign & 15
    & 965 2-3 (a) Compute accuracy, precision, and recall. (b) What is the accuracy of a classifier that
    always says "benign"? What does the comparison tell you, and which curve would you use to compare
    detectors on this data?'
  parts:
  - kind: free
    prompt: 'A detector labels 1,000 flows; 20 of them are attacks (attack is the positive class). Its
      confusion matrix: 1c & 1cPredicted attack & 1cPredicted benign 2-3 True attack & 15 & 5 2-3 True
      benign & 15 & 965 2-3 (a) Compute accuracy, precision, and recall. (b) What is the accuracy of a
      classifier that always says "benign"? What does the comparison tell you, and which curve would you
      use to compare detectors on this data?'
    solution: '(a) Accuracy = (15+965)/1000 = 98%. Precision = 15/(15+15) = 50%. Recall = 15/(15+5) =
      75%. (b) Always-benign: 980/1000 = 98%, the same accuracy while catching no attacks. Under class
      imbalance accuracy is misleading; use precision and recall, and the precision-recall curve rather
      than ROC.'
    height_in: 1.8
    id: '12'
    points: 5.0
    criteria:
    - id: a
      points: 2.5
